name: Notificação do Preview

on:
  check_run:
    types: [completed]

jobs:
  notificar_discord:
    runs-on: ubuntu-latest
    
    steps:      
      - name: 🔍 Debug (Ver o que ativou o gatilho)
        run: |
          echo "=== INFORMAÇÕES DO CHECK RUN ==="
          echo "App Name: ${{ github.event.check_run.app.name }}"
          echo "App Slug: ${{ github.event.check_run.app.slug }}"
          echo "Branch: ${{ github.event.check_run.check_suite.head_branch }}"
          echo "Conclusion: ${{ github.event.check_run.conclusion }}"
          echo "================================"

      - name: Enviar Sucesso para o Discord
        if: github.event.check_run.app.slug == 'cloudflare-pages' && github.event.check_run.check_suite.head_branch == 'preview' && github.event.check_run.conclusion == 'success'
        run: |
          curl -H "Content-Type: application/json" \
          -d '{"content": "✅ **Preview Atualizado!**\nAs alterações foram compiladas e estão prontas para revisão.\n"}' \
          ${{ secrets.DISCORD_WEBHOOK_URL }}

      # Passo 3: O Envio de Falha
      - name: Enviar Falha para o Discord
        if: github.event.check_run.app.slug == 'cloudflare-pages' && github.event.check_run.check_suite.head_branch == 'preview' && (github.event.check_run.conclusion == 'failure' || github.event.check_run.conclusion == 'timed_out')
        run: |
          curl -H "Content-Type: application/json" \
          -d '{"content": "❌ **Erro no deploy do Preview!**\nA Cloudflare não conseguiu compilar o Astro. Verifique se alguma formatação crítica foi quebrada."}' \
          ${{ secrets.DISCORD_WEBHOOK_URL }}
