name: Notificação do Preview

on:
  check_run:
    types: [completed]

jobs:
  notificar_discord:
    runs-on: ubuntu-latest
    
    # Executa apenas se o aviso vier da Cloudflare (já sabemos que é o preview pela configuração do painel)
    if: github.event.check_run.app.slug == 'cloudflare-workers-and-pages'
    
    steps:
      - name: Enviar Sucesso para o Discord
        if: github.event.check_run.conclusion == 'success'
        run: |
          curl -H "Content-Type: application/json" \
          -d '{"content": "✅ **Preview Atualizado!**\nAs alterações foram compiladas e estão prontas para revisão.\n"}' \
          ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: Enviar Falha para o Discord
        if: github.event.check_run.conclusion == 'failure' || github.event.check_run.conclusion == 'timed_out'
        run: |
          curl -H "Content-Type: application/json" \
          -d '{"content": "❌ **Erro no deploy do Preview!**\n"}' \
          ${{ secrets.DISCORD_WEBHOOK_URL }}
